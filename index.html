<!DOCTYPE html>
<html lang="vi">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dữ liệu chuyến ver 2.1</title>
        <style>
            table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
            }
            
            th, td {
                border: 1px solid black;
                padding: 8px;
                text-align: center;
            }
            
            /* Kiểu dáng cho các nút */
            button {
                margin-right: 10px;
                padding: 8px 15px;
                cursor: pointer;
            }
            
            /* Ẩn input chọn tệp */
            #importFile {
                display: none;
            }
        </style>
    </head>

    <body>

        <h1>Số chuyến</h1>

        <label for="ngayThang">Ngày tháng:</label>
        <input type="date" id="ngayThang"><br><br>

        <label for="soChuyen">Số chuyến:</label>
        <input type="number" id="soChuyen"><br><br>

        <button onclick="themDuLieu()">Thêm</button>

        <button onclick="xuatDuLieu()">Xuất dữ liệu</button>
        <button onclick="document.getElementById('importFile').click()">Nhập dữ liệu</button>
        <button onclick="xoaToanBoDuLieu()">Xoá toàn bộ dữ liệu</button>
            <input type="file" id="importFile" accept=".txt,.json">
        <h2>Dữ liệu chuyến đi</h2>
        <table id="duLieuTable">
            <tr>
                <th>Ngày tháng</th>
                <th>Số chuyến</th>
                <th>Xoá</th>
            </tr>
        </table>

        <h2>Thống kê theo tháng</h2>
        <table id="thongKeTable">
            <tr>
                <th>Tháng</th>
                <th>Tổng số chuyến</th>
            </tr>
        </table>

        <script>
            // Mảng để lưu trữ dữ liệu chuyến đi
            let duLieu = [];
            // Khóa để lưu trữ dữ liệu trong localStorage
            const storageKey = 'chuyenDiData';
            
            // Hàm để tải dữ liệu từ localStorage
            function loadDuLieu() {
                const storedDuLieu = localStorage.getItem(storageKey);
                if (storedDuLieu) {
                    try {
                        // Cố gắng phân tích cú pháp dữ liệu đã lưu
                        duLieu = JSON.parse(storedDuLieu);
                        // Kiểm tra cơ bản để đảm bảo đây là một mảng và chứa các đối tượng
                        if (!Array.isArray(duLieu)) {
                             console.error("Dữ liệu lưu trữ không phải là mảng.");
                             duLieu = []; // Đặt lại nếu không hợp lệ
                             saveDuLieu(); // Xóa dữ liệu không hợp lệ
                             return;
                        }
                         // Đảm bảo 'soChuyen' được coi là số sau khi tải
                        duLieu.forEach(item => {
                            if (typeof item.soChuyen !== 'number') {
                                item.soChuyen = parseInt(item.soChuyen) || 0; // Phân tích, mặc định là 0 nếu không hợp lệ
                            }
                        });
            
                        hienThiDuLieu();
                        tinhThongKe();
                    } catch (e) {
                        console.error("Lỗi khi đọc dữ liệu từ localStorage:", e);
                        duLieu = []; // Đặt lại nếu phân tích cú pháp thất bại
                        saveDuLieu(); // Xóa dữ liệu lỗi
                    }
                }
            }
            
            // Hàm để lưu dữ liệu vào localStorage
            function saveDuLieu() {
                try {
                     localStorage.setItem(storageKey, JSON.stringify(duLieu));
                } catch (e) {
                    console.error("Lỗi khi lưu dữ liệu vào localStorage:", e);
                    alert("Không thể lưu dữ liệu. Bộ nhớ trình duyệt có thể đã đầy hoặc bị hạn chế.");
                }
            }
            
            // Hàm để thêm dữ liệu mới
            function themDuLieu() {
                const ngayThang = document.getElementById("ngayThang").value;
                const soChuyenInput = document.getElementById("soChuyen").value;
                const soChuyen = parseInt(soChuyenInput);
            
                // Kiểm tra xem ngày đã được chọn và số có hợp lệ không
                if (ngayThang && !isNaN(soChuyen) && soChuyenInput.trim() !== '') {
                    // Kiểm tra xem đã có mục nhập cho ngày này chưa
                    const existingIndex = duLieu.findIndex(item => item.ngayThang === ngayThang);
            
                    if (existingIndex > -1) {
                        // Cập nhật mục nhập hiện có
                        duLieu[existingIndex].soChuyen = soChuyen;
                    } else {
                        // Thêm mục nhập mới
                        duLieu.push({ ngayThang, soChuyen });
                         // Tùy chọn: Sắp xếp theo ngày sau khi thêm
                        duLieu.sort((a, b) => new Date(a.ngayThang) - new Date(b.ngayThang));
                    }
            
                    hienThiDuLieu();
                    tinhThongKe();
                    saveDuLieu();
            
                    // Xóa các trường nhập sau khi thêm
                    document.getElementById("ngayThang").value = '';
                    document.getElementById("soChuyen").value = '';
            
                } else {
                    alert("Xin chọn ngày tháng vào số chuyến.");
                }
            }
            
            // Hàm để hiển thị dữ liệu trong bảng
            function hienThiDuLieu() {
                const table = document.getElementById("duLieuTable");
                // Logic xóa hàng đã sửa: giữ hàng tiêu đề
                while (table.rows.length > 1) {
                    table.deleteRow(1);
                }
            
                duLieu.forEach((item, index) => {
                    const row = table.insertRow();
                    const date = new Date(item.ngayThang);
                     // Đảm bảo ngày hợp lệ trước khi định dạng
                    const formattedDate = isNaN(date.getTime()) ? 'Ngày không hợp lệ' : `${date.getDate().toString().padStart(2, '0')}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getFullYear()}`;
            
                    row.insertCell().textContent = formattedDate;
                    row.insertCell().textContent = item.soChuyen;
            
                    const deleteCell = row.insertCell();
                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Xoá";
                    deleteButton.onclick = () => xoaDuLieu(index);
                    deleteCell.appendChild(deleteButton);
                });
            }
            
            // Hàm để xóa một mục dữ liệu
            function xoaDuLieu(index) {
                if (confirm("Bạn có chắc chắn muốn xoá mục này không?")) {
                    duLieu.splice(index, 1);
                    hienThiDuLieu();
                    tinhThongKe();
                    saveDuLieu();
                }
            }
            
            // Hàm để tính toán và hiển thị thống kê theo tháng dương lịch (từ ngày 1 đến cuối tháng)
            function tinhThongKe() {
                const thongKe = {};
                duLieu.forEach(item => {
                    const date = new Date(item.ngayThang);
                     // Bỏ qua các ngày không hợp lệ
                    if (isNaN(date.getTime())) {
                         console.warn("Bỏ qua ngày không hợp lệ trong thống kê:", item.ngayThang);
                         return;
                     }
                    let year = date.getFullYear();
                    let month = date.getMonth(); // 0 cho tháng 1, 11 cho tháng 12
            
                    // Chu kỳ mới: Tính theo đúng tháng và năm của ngày nhập
                    // Định dạng chu kỳ là MM/YYYY
                    const chuKy = `${(month + 1).toString().padStart(2, '0')}/${year}`;
                    thongKe[chuKy] = (thongKe[chuKy] || 0) + item.soChuyen;
                });
            
                const table = document.getElementById("thongKeTable");
                // Xóa các hàng trước đó, giữ hàng tiêu đề
                while (table.rows.length > 1) {
                     table.deleteRow(1);
                }
            
                 // Sắp xếp các chu kỳ theo thứ tự thời gian trước khi hiển thị
                 const sortedChuKys = Object.keys(thongKe).sort();
            
                 sortedChuKys.forEach(chuKy => {
                    const row = table.insertRow();
                    row.insertCell().textContent = chuKy;
                    row.insertCell().textContent = thongKe[chuKy];
                });
            }
            
            // --- Các hàm mới để nhập/xuất dữ liệu ---
            
            // Hàm để xuất dữ liệu ra tệp văn bản
            function xuatDuLieu() {
                if (duLieu.length === 0) {
                    alert("Không có dữ liệu để xuất.");
                    return;
                }
            
                // Chuyển đổi mảng dữ liệu thành chuỗi JSON
                const dataString = JSON.stringify(duLieu, null, 2); // null, 2 để định dạng đẹp
            
                // Tạo một Blob từ chuỗi
                const blob = new Blob([dataString], { type: 'text/plain' });
            
                // Tạo một phần tử liên kết
                const link = document.createElement('a');
            
                // Tạo URL cho blob
                link.href = URL.createObjectURL(blob);
            
                // Đặt tên tệp để tải xuống (ví dụ: chuyen_di_data_YYYYMMDD.txt)
                const today = new Date();
                const dateString = `${today.getFullYear()}${String(today.getMonth() + 1).padStart(2, '0')}${String(today.getDate()).padStart(2, '0')}`;
                link.download = `chuyen_di_data_${dateString}.txt`;
            
                // Thêm liên kết vào body, nhấp vào nó và loại bỏ nó
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            
                // Xóa URL đối tượng
                URL.revokeObjectURL(link.href);
            }
            
            // Trình lắng nghe sự kiện cho input tệp ẩn
            document.getElementById('importFile').addEventListener('change', nhapDuLieu);
            
            // Hàm để nhập dữ liệu từ tệp văn bản
            function nhapDuLieu(event) {
                const file = event.target.files[0];
            
                if (!file) {
                    return; // Không có tệp nào được chọn
                }
            
                const reader = new FileReader();
            
                reader.onload = function(e) {
                    const fileContent = e.target.result;
            
                    try {
                        // Cố gắng phân tích cú pháp nội dung JSON
                        const importedData = JSON.parse(fileContent);
            
                        // Xác thực cơ bản cấu trúc dữ liệu được nhập
                        if (!Array.isArray(importedData)) {
                            alert("Chỉ nhập số.");
                            return;
                        }
            
                        // Xác thực thêm: kiểm tra xem các mục có các thuộc tính mong đợi không
                        const isValid = importedData.every(item =>
                            item.hasOwnProperty('ngayThang') &&
                            item.hasOwnProperty('soChuyen') &&
                            typeof item.ngayThang === 'string' &&
                            (typeof item.soChuyen === 'number' || (typeof item.soChuyen === 'string' && !isNaN(parseInt(item.soChuyen)))) // Chấp nhận số hoặc chuỗi có thể phân tích thành số
                        );
            
                        if (!isValid) {
                             alert("Sai định dạng file.");
                             return;
                        }
            
                         // Chuyển đổi soChuyen thành số cho tất cả các mục được nhập
                        const cleanedData = importedData.map(item => ({
                            ngayThang: item.ngayThang,
                            soChuyen: parseInt(item.soChuyen) || 0 // Đảm bảo đó là một số, mặc định là 0 nếu phân tích thất bại
                        }));
            
            
                        // Thay thế dữ liệu hiện tại bằng dữ liệu được nhập
                        duLieu = cleanedData;
            
                        // Tùy chọn: Sắp xếp dữ liệu được nhập theo ngày
                         duLieu.sort((a, b) => new Date(a.ngayThang) - new Date(b.ngayThang));
            
            
                        // Cập nhật hiển thị, thống kê và localStorage
                        hienThiDuLieu();
                        tinhThongKe();
                        saveDuLieu();
            
                        alert("Dữ liệu đã được nhập thành công!");
            
                    } catch (error) {
                        console.error("Lỗi khi xử lý tệp nhập:", error);
                        alert("Lỗi khi đọc hoặc phân tích cú pháp tệp.");
                    } finally {
                        // Xóa giá trị của input tệp để có thể chọn lại cùng một tệp
                        event.target.value = '';
                    }
                };
            
                // Đọc tệp dưới dạng văn bản
                reader.readAsText(file);
            }
            
            		// chức năng xóa toàn bộ dữ liệu đã nhập
            function xoaToanBoDuLieu() {
                if (confirm("Bạn có chắc chắn muốn xóa toàn bộ dữ liệu đã nhập chứ?")) {
                    duLieu = []; // Xóa mảng dữ liệu
                    hienThiDuLieu(); // Cập nhật bảng hiển thị
                    tinhThongKe(); // Cập nhật bảng thống kê
                    saveDuLieu(); // Lưu mảng trống vào localStorage
                    alert("Đã xóa toàn bộ dữ liệu đã nhập");
                }
            }
            
            // Tải dữ liệu khi trang tải
            loadDuLieu();
            
            // Thêm trình lắng nghe sự kiện vào các trường nhập biểu mẫu để có thể gửi bằng phím Enter (tùy chọn)
            document.getElementById("soChuyen").addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault(); // Ngăn chặn gửi biểu mẫu mặc định
                    themDuLieu();
                }
            });
        </script>

    </body>

</html>
